[package]
name = "lemmata-desktop"
version = "0.4.0"
description = "Lemmata: the proof checker, offline, as a desktop app"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "lemmata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
