<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="{{ root }}app/static/icon.svg" type="image/svg+xml" />
    <script>
      // The theme is shared with the app (the same storage key), and resolved
      // before first paint so neither flashes the other palette.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("aether-theme"); } catch (err) {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!-- The page's paper from the first frame: Firefox paints a new page
         before its stylesheets arrive, so without this, moving between the
         site and the app begins with a frame of white. -->
    <style>
      html { background: #ffffff; color-scheme: light; }
      html[data-theme="dark"] { background: #0e1013; color-scheme: dark; }
    </style>
    <link rel="stylesheet" href="{{ root }}app/static/fonts.css" />
    <link rel="stylesheet" href="{{ root }}assets/site.css" />
    <script type="module" src="{{ root }}assets/site.js"></script>
