[project]
name = "aether"
version = "0.1.0"
description = "Lemmata: check undergraduate proofs line by line, in the notation of the notes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Samuel Okwuonu", email = "s.okwuonu07@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "lark>=1.3.1",
    "pytest>=9.1.1",
    "sympy>=1.14.0",
    "uvicorn>=0.54.0",
    "z3-solver>=5.1.0.0",
]

[project.scripts]
lemmata = "aether:main"
aether = "aether:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
