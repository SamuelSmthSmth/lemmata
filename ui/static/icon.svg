<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The favicon: the open tombstone, drawn on the 16px grid so every edge
       lands on a whole pixel (desktop/icon.svg is the large, padded app icon). -->
  <rect width="16" height="16" rx="3" fill="#0a5fbf"/>
  <rect x="4" y="4" width="8" height="8" fill="none" stroke="#ffffff" stroke-width="2" shape-rendering="crispEdges"/>
</svg>
