name: Desktop

# The desktop app (desktop/): the static build in a Tauri shell.
#
# Every change that could affect it is built and driven on Linux, the one
# platform whose webview has a WebDriver in CI (WebKitGTK).  Installers for
# Linux, Windows and macOS are built only on a version tag or by hand, since
# macOS minutes cost ten times as much; a tag also drafts a GitHub release.

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths: ["desktop/**", "ui/**", "src/**", "courses/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "ui/**", "src/**", "courses/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

# Python reads and writes UTF-8 everywhere, Windows included (the packs and
# pages are full of ∀, −, ε).
env:
  PYTHONUTF8: "1"

jobs:
  check:
    name: Desktop app, driven over WebDriver (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install WebKitGTK, its WebDriver and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - name: Cache tauri-driver
        id: driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}
      - if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Cache the vendored Pyodide set
        uses: actions/cache@v4
        with:
          path: ui/static/vendor/pyodide
          key: pyodide-${{ hashFiles('ui/vendor_pyodide.py') }}
      - run: uv sync --frozen
      - run: npm ci
        working-directory: desktop
      # tauri::generate_context! embeds the site at compile time; the shell's
      # own unit tests need only a page to be there.
      - run: |
          mkdir -p ../build/www && test -f ../build/www/index.html || echo '<!doctype html>' > ../build/www/index.html
          cargo test --release
        working-directory: desktop/src-tauri
      - run: xvfb-run -a uv run python desktop/verify_desktop.py

  installers:
    name: Installers (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the .deb and AppImage run on older glibc.
          - { name: Linux, os: ubuntu-22.04, args: "", bundle: "desktop/src-tauri/target/release/bundle" }
          - { name: Windows, os: windows-latest, args: "", bundle: "desktop/src-tauri/target/release/bundle" }
          - { name: macOS, os: macos-latest, args: "-- --target universal-apple-darwin", bundle: "desktop/src-tauri/target/universal-apple-darwin/release/bundle" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev patchelf libfuse2 file
      - run: uv sync --frozen
      - run: uv run python desktop/build.py ${{ matrix.args }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: lemmata-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Draft a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # Versionless copies, so the site's .../releases/latest/download/<file>
      # links (web/content.py DESKTOP_FILES) always reach the newest build.
      - name: Add versionless copies
        working-directory: installers
        run: |
          shopt -s nullglob
          for f in *.AppImage; do cp "$f" Lemmata_amd64.AppImage; done
          for f in *_amd64.deb; do cp "$f" Lemmata_amd64.deb; done
          for f in *.x86_64.rpm; do cp "$f" Lemmata.x86_64.rpm; done
          for f in *_x64-setup.exe; do cp "$f" Lemmata_x64-setup.exe; done
          for f in *_x64_en-US.msi; do cp "$f" Lemmata_x64_en-US.msi; done
          for f in *_universal.dmg; do cp "$f" Lemmata_universal.dmg; done
          ls -la
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Lemmata $GITHUB_REF_NAME" \
            --notes "Desktop installers for Linux (.deb, .rpm, .AppImage), Windows (.msi, .exe) and macOS (.dmg). They are not code-signed yet: Windows SmartScreen and macOS Gatekeeper will warn on first launch." \
            installers/*
