name: CI

# The same gates AGENTS.md lists, minus the real-browser check
# (ui/verify_browser.py drives a local Chrome through agent-browser).

on:
  push:
    branches: [master]
  pull_request:

jobs:
  engine:
    name: Engine and lecture-note corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      # pytest shares one warm checker; students meet each proof cold. Every
      # entry, in its own process, within the app's 20 s check budget.
      - run: uv run python tests/lecture_notes/run_corpus.py --budget 20

  ui:
    name: UI contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pdflatex and the packages the PDF export uses
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended cm-super
      - run: uv sync --frozen
      - run: uv run python ui/verify_examples.py
      - run: uv run python ui/verify_capabilities.py
      - run: uv run python ui/verify_server.py
      - run: node ui/verify_frontend.mjs

  wasm:
    name: Engine in the browser's Python (Pyodide) and the static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Cache the vendored Pyodide set
        uses: actions/cache@v4
        with:
          path: ui/static/vendor/pyodide
          key: pyodide-${{ hashFiles('ui/vendor_pyodide.py') }}
      - run: uv sync --frozen
      - name: Vendor Pyodide and the engine wheels (sha256-pinned)
        run: test -f ui/static/vendor/pyodide/pyodide.mjs || uv run python ui/vendor_pyodide.py
      # Every pinned verdict, under Pyodide, against the native engine.
      - run: node ui/verify_wasm.mjs
      - run: uv run python ui/build_static.py
      # The public site around it: links, the landing page's audits against
      # the engine, hosting rules, the installer (browser checks need
      # agent-browser, so they run locally).
      - run: uv run python web/verify_web.py
