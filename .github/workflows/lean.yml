name: Lean

# "Show me in Lean" promises a skeleton that compiles.  Every pinned proof --
# the bundled examples, every course-pack entry, the capability probes and the
# Guide's examples -- is exported to Lean and the lot compiled against the
# Mathlib release lean/lakefile.toml pins.  A `sorry` is a warning, as it
# should be; any error fails the run, named by the source it came from.

on:
  push:
    branches: [master, "lean/**"]
    paths:
      - "src/**"
      - "courses/**"
      - "lean/**"
      - "ui/examples.py"
      - "ui/verify_capabilities.py"
      - "ui/static/guide/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "src/**"
      - "courses/**"
      - "lean/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  skeletons:
    name: Every skeleton compiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Export every pinned proof to Lean
        run: uv run python lean/generate.py
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml') }}
      - name: Fetch Mathlib's prebuilt files
        working-directory: lean
        run: lake exe cache get
      - name: Compile
        working-directory: lean
        run: |
          set +e
          lake env lean Generated.lean > lean.log 2>&1
          status=$?
          echo "lean exited with $status"
          grep -c "declaration uses .sorry." lean.log | xargs echo "sorry warnings:"
          cd .. && uv run python lean/generate.py --explain lean/lean.log
          explained=$?
          if [ $status -ne 0 ] || [ $explained -ne 0 ]; then
            grep -v "declaration uses .sorry.\|Try this: intro" lean/lean.log | tail -n 60
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-log
          path: |
            lean/lean.log
            lean/Generated.lean
